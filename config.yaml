# ============================================================
# iot-sim-gateway Configuration
# ============================================================

simulator:
  device_count: 15
  report_interval_sec: 2
  heartbeat_interval_sec: 10
  base_temp_range: [22, 28]
  base_humidity_range: [45, 65]
  anomaly:
    drift_rate_range: [0.02, 0.15]    # °C/s
    spike_probability: 0.01            # per reading
    dropout_probability: 0.005         # per reading
    stuck_duration_range: [30, 120]    # seconds

gateway:
  db_path: "data/sensor.db"
  alert_history_sec: 60               # seconds of data sent with alert

mqtt:
  broker: "localhost"
  port: 1883
  topic_data: "iot/sensors/+/data"
  topic_heartbeat: "iot/sensors/+/heartbeat"

alerts:
  rules:
    - name: "高温告警"
      field: temperature
      upper: 35
      lower: null
      debounce_count: 3
      cooldown_sec: 60
      severity: critical
      trend_watch: true

    - name: "低温告警"
      field: temperature
      lower: 10
      debounce_count: 2
      cooldown_sec: 30
      severity: warning
      trend_watch: false

    - name: "高湿告警"
      field: humidity
      upper: 90
      lower: null
      debounce_count: 2
      cooldown_sec: 60
      severity: warning
      trend_watch: false

    - name: "低湿告警"
      field: humidity
      lower: 20
      debounce_count: 2
      cooldown_sec: 60
      severity: info
      trend_watch: false

feishu:
  webhook_url: ""                      # 飞书机器人 Webhook URL
  enable_ai_diagnosis: true

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"       # read from env
  model: "deepseek-v4-flash"
